<style>
:root{
  --bg1:#efe9ff;--bg2:#ffe3f4;--ink:#241b3a;--mute:#6d6487;--line:#d9d0f0;
  --pink:#ff3fae;--violet:#7a5cff;--card:#ffffffd9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Huninn,"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);
  background:radial-gradient(120% 80% at 10% 0%,#fff 0%,var(--bg1) 45%,var(--bg2) 100%) fixed;}
.app{max-width:440px;margin:0 auto;padding:14px 14px 40px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top .t{font-size:13px;color:var(--mute);letter-spacing:.06em}
.days{display:flex;align-items:center;gap:6px;font-size:13px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 10px 5px 8px}
.days .dots{display:flex;gap:3px}
.days .dots i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#fff,#b9b3cf 55%,#6e6890);box-shadow:inset 0 0 0 1px #8d86aa}
.days .dots i.used{background:#e9e5f3;box-shadow:inset 0 0 0 1px #d4cee6}
.days b{font-size:15px}
.card{background:var(--card);backdrop-filter:blur(6px);border:1.5px solid #fff;border-radius:22px;padding:18px 16px;box-shadow:0 10px 30px -18px #5a3c9a66}
.step{font-size:12px;color:var(--violet);letter-spacing:.12em;margin-bottom:4px}
h2{font-size:22px;margin:0 0 6px;font-weight:400}
p{line-height:1.65;margin:6px 0}
.sub{color:var(--mute);font-size:14px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:12px;font:inherit;color:inherit;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt .pv{flex:0 0 74px;height:74px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.opt .tx{flex:1}
.opt .tx b{display:block;font-weight:400;font-size:16px}
.opt .tx small{color:var(--mute);font-size:12.5px;line-height:1.5;display:block;margin-top:2px}
.opt.sel{border-color:var(--violet);box-shadow:0 0 0 3px #7a5cff33}
.cost{font-size:12px;border-radius:999px;padding:3px 8px;white-space:nowrap;background:#f1edfb;color:#5b4a99}
.cost.ai{background:linear-gradient(90deg,#ffd3ef,#d9d0ff);color:#7a2a6a}
.opt[disabled]{opacity:.42;cursor:not-allowed}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-size:17px;cursor:pointer;margin-top:12px;color:#fff;
  background:linear-gradient(135deg,#2c2347,#4b3c7a);box-shadow:0 8px 20px -10px #2c2347}
.btn.ai{color:#5a1d4f;background:linear-gradient(120deg,#ffe0f3,#e3dbff 50%,#d6f3ff);box-shadow:inset 0 0 0 1.5px #fff,0 8px 20px -12px #b04a9a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px}.row>*{flex:1}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;color:inherit}
.chip.on{background:#2c2347;color:#fff;border-color:#2c2347}
.label{font-size:13px;color:var(--mute);margin:14px 0 4px}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.prod{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:6px;cursor:pointer;text-align:center;font-size:12px;color:var(--mute)}
.prod img{width:100%;height:70px;object-fit:contain;display:block}
.prod.on{border-color:var(--violet);box-shadow:0 0 0 3px #7a5cff33;color:var(--ink)}
.ai-say{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
.ai-say .who{flex:0 0 34px;height:34px;border-radius:50%;background:conic-gradient(from 200deg,#ffc6ec,#c9b8ff,#a7ecff,#ffc6ec);display:flex;align-items:center;justify-content:center;font-size:12px;color:#5a1d4f}
.bubble{background:#fff;border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:14.5px;line-height:1.6;box-shadow:0 4px 14px -10px #5a3c9a}
.say{background:#fff;border-radius:14px;padding:10px 12px;margin-top:8px;font-size:14.5px;line-height:1.6;border:1.5px solid var(--line)}
.say b{font-weight:400;color:var(--violet)}
.say.good{border-color:#9be3c0}.say.bad{border-color:#ffc0d8}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2c2347;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* poster */
.poster{position:relative;width:100%;aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:#fff;box-shadow:0 18px 40px -20px #3a2470;container-type:inline-size;user-select:none;-webkit-user-select:none}
.poster .el{position:absolute;display:flex;align-items:center;justify-content:center}
.poster .pbg{position:absolute;inset:0}
.poster .el img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 1.2cqw 1.6cqw #0004)}
.poster svg{width:100%;height:100%;overflow:visible}
.poster.edit .el{touch-action:none;cursor:grab;outline:1px dashed #ffffff88;outline-offset:-1px}
.poster.edit .el.sel{outline:2px solid #fff;box-shadow:0 0 0 2px var(--violet) inset}
.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#fff6 1px,transparent 1px),linear-gradient(90deg,#fff6 1px,transparent 1px);background-size:calc(100%/12) calc(100%/15);opacity:.45}
.hdl{position:absolute;right:-9px;bottom:-9px;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--violet);cursor:nwse-resize;z-index:5;touch-action:none}
.chip.sw i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;box-shadow:0 0 0 1px #0002}
.bigt{width:100%;margin:2px 0 6px}.bigt svg{width:100%;height:100%;display:block}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tools .chip{font-size:13px;padding:7px 11px}
.flash{position:fixed;inset:0;background:#120c22f2;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff}
.flash .poster{width:min(78vw,340px)}
.flash .cd{font-size:44px}
.tape{position:relative;padding:14px 10px 6px}
.tape:before,.tape:after{content:"";position:absolute;top:4px;width:70px;height:22px;background:#fffbe8cc;box-shadow:0 1px 3px #0002;z-index:2}
.tape:before{left:6px;transform:rotate(-8deg)}.tape:after{right:6px;transform:rotate(7deg)}

/* report */
.pct{text-align:center;font-size:15px;color:var(--mute)}
.meter{margin:10px 0}
.meter .hd{display:flex;justify-content:space-between;font-size:14px}
.meter .bar{height:12px;border-radius:999px;background:#ece7f8;overflow:hidden;margin-top:4px}
.meter .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#7a5cff,#ff5fbf)}
.meter.pretty .bar i{background:repeating-linear-gradient(135deg,#cfc6ea 0 6px,#e8e2f7 6px 12px)}
.meter small{color:var(--mute);font-size:12px}
.gap{background:#2c2347;color:#fff;border-radius:16px;padding:12px 14px;margin:12px 0;font-size:14.5px;line-height:1.6}
.twins{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.twins img,.twins .poster{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px}
.twins .cap{font-size:11px;color:var(--mute);text-align:center;margin-top:3px}
.log{font-size:13.5px;line-height:1.7;padding-left:0;list-style:none;margin:6px 0}
.log li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0}
.log .me{color:#2f8f62}.log .ai{color:#b04a9a}
.research{font-size:13px;line-height:1.65;color:#4a4166;background:#fff;border-radius:14px;padding:10px 12px;margin-top:8px}
.research p{margin:4px 0}
.foot{font-size:11.5px;color:var(--mute);text-align:center;margin-top:18px;line-height:1.6}
</style>
</head>

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ===================== 液態金屬字 ===================== */
// 每段字固定用 100 單位排，再用 viewBox 縮放到格子大小，所以放多大光影都一樣、字不會黏在一起。
const FS=100, LS=7, LH=122;
const _cv=document.createElement('canvas').getContext('2d');
const isLatin = ch => /[\u0000-ɏ]/.test(ch);
function measure(str, latin){_cv.font=`${FS}px ${latin?EN_FONT:ZH_FONT}`;return _cv.measureText(str).width + LS*[...str].length}
function tokens(text){ // 英文以單字為單位、中文以字為單位
  const out=[]; let buf='';
  for(const ch of text){ if(isLatin(ch)&&ch!==' '){buf+=ch} else { if(buf){out.push(buf);buf=''} out.push(ch) } }
  if(buf)out.push(buf); return out;
}
function runsOf(line){const r=[];for(const ch of line){const l=isLatin(ch);if(r.length&&r[r.length-1].l===l)r[r.length-1].t+=ch;else r.push({l,t:ch})}return r}
function lineW(line){return runsOf(line).reduce((a,r)=>a+measure(r.t,r.l),0)}
function wrap(text,n){
  if(n===1)return [text];
  const tk=tokens(text), total=lineW(text), target=total/n, lines=[]; let cur='';
  for(const t of tk){ if(cur && lines.length<n-1 && lineW(cur+t)>target*1.08){lines.push(cur.trim());cur=t.trimStart()} else cur+=t }
  lines.push(cur.trim()); return lines.filter(Boolean);
}
// w,h：框的比例（格數）；paint：漸層 id；metal=false 時用純色、不加光影
function textSVG(text, w, h, {paint='chromeG', metal=true, color='#fff', maxLines=3}={}){
  let best=null;
  for(let n=1;n<=maxLines;n++){
    const lines=wrap(text,n); const mw=Math.max(...lines.map(lineW))+FS*.3; const mh=lines.length*LH+FS*.3;
    const sc=Math.min(w/mw,h/mh);
    if(!best||sc>best.sc*1.04)best={sc,lines,mw,mh};
  }
  const {lines,mw,mh}=best;
  const vw=Math.max(mw,mh*w/h), vh=vw*h/w;
  const fill = metal?`url(#${paint})`:color;
  const y0=vh/2-(lines.length-1)*LH/2;
  const body=lines.map((ln,i)=>`<text x="${vw/2}" y="${y0+i*LH}" dy=".35em" text-anchor="middle" font-size="${FS}" letter-spacing="${LS}">${
    runsOf(ln).map(r=>`<tspan font-family="${r.l?EN_FONT:ZH_FONT}" ${metal?`stroke="${fill}" stroke-width="${r.l?2:4.5}"`:''}>${esc(r.t)}</tspan>`).join('')}</text>`).join('');
  return `<svg viewBox="0 0 ${vw.toFixed(1)} ${vh.toFixed(1)}" preserveAspectRatio="xMidYMid meet"><g ${metal?'filter="url(#liquid)"':''} fill="${fill}" stroke-linejoin="round" paint-order="stroke">${body}</g></svg>`;
}

/* ===================== 計分（唯一的規則來源） ===================== */
function scores(st=S){
  let K=45,T=35,M=50,P=50; const flags=new Set();
  const add=fx=>{K+=fx.K||0;T+=fx.T||0;M+=fx.M||0;P+=fx.P||0};
  if(st.nameAI){M-=15;flags.add('distinct')} else if(st.name){M+=5; if(NAME_HINT.test(st.name))K+=6; if([...st.name].length>8)K-=5}
  if(st.logo){add(LOGOS[st.logo].fx); if(st.logo==='ai')flags.add('distinct')}
  if(st.palette){add(PALETTES[st.palette].fx); if(st.palette==='violet'&&st.brief.has('E'))T+=5}
  if(st.titleStyle)add(TITLE_STYLES[st.titleStyle].fx);
  if(st.colorAI){M-=4;flags.add('distinct')}
  const items = st.briefAI ? AI_BRIEF : [...st.brief];
  items.forEach(id=>add(BRIEF.find(b=>b.id===id).fx));
  if(items.length>5){K-=15;flags.add('clutter')}
  if(!items.includes('A'))flags.add('audience');
  if(st.products.size>=5){K-=8;flags.add('clutter')}
  const els=st.elements;
  if(els.length){
    const area=e=>e.w*e.h;
    const prods=els.filter(e=>e.type==='product');
    const maxA=Math.max(0,...prods.map(area));
    if(maxA>=36)K+=15; else if(maxA>=16)K+=5; else K-=20;
    if(maxA<36)flags.add('product');
    const titles=els.filter(e=>e.type==='title');
    const nameA=Math.max(0,...titles.filter(e=>!e.txt||e.txt===st.name).map(area));
    const otherA=Math.max(0,...titles.filter(e=>e.txt&&e.txt!==st.name).map(area));
    if(nameA>=54)K+=10; else if(nameA<=12)K-=10;
    if(otherA>nameA){K-=4;M-=8;flags.add('distinct')}
    const n=els.filter(e=>e.type==='sticker').length;
    P+=Math.min(16,n*2);
    if(n>=8){K-=15;flags.add('clutter')} else if(n>=4){K-=8;flags.add('clutter')}
    const info=els.find(e=>e.type==='info');
    if(info && items.length>4)K-=10;
    if(!st.layoutSelf){M-=8;flags.add('distinct')}
    if(st.bg==='pink'){M-=4}
  }
  if(st.tested)K+=5;
  if(st.exportJpg)K-=8;
  K+=st.luck;
  const c=v=>Math.max(0,Math.min(100,Math.round(v)));
  K=c(K);T=c(T);M=c(M);P=c(P);
  return {K,T,M,P,total:Math.round(.4*K+.3*T+.3*M),flags};
}

/* ===================== 海報 ===================== */
function logoSVG(kind, name, paint, ink){
  const ch=[...(name||'Y2K')].slice(0,2).join('');
  if(kind==='wordmark') return `<svg viewBox="0 0 100 100"><g filter="url(#liquid)"><use href="#s-butter" x="8" y="8" width="84" height="84" fill="url(#${paint})"/></g></svg>`;
  if(kind==='stamp') return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="${ink}" stroke-width="6"/><circle cx="50" cy="50" r="34" fill="none" stroke="${ink}" stroke-width="2"/><text x="50" y="50" dy=".36em" text-anchor="middle" font-family="${isLatin(ch[0])?EN_FONT:ZH_FONT}" font-size="${[...ch].length>1?26:38}" fill="${ink}">${esc(ch)}</text></svg>`;
  return `<svg viewBox="0 0 100 100"><g filter="url(#liquid)"><use href="#s-blob" x="6" y="6" width="88" height="88" fill="url(#${paint})"/></g><text x="50" y="50" dy=".36em" text-anchor="middle" font-family="${isLatin(ch[0])?EN_FONT:ZH_FONT}" font-size="30" fill="#3a2f55">${esc(ch)}</text></svg>`;
}
const STICKERS=['s-spark','s-heart','s-star','s-butter','s-spark','s-blob','s-heart','s-spark','s-star','s-butter'];
function stickerSVG(sym, paint){return `<svg viewBox="0 0 100 100"><g filter="url(#liquid)"><use href="#${sym}" x="10" y="10" width="80" height="80" fill="url(#${paint})" stroke="url(#${paint})"/></g></svg>`}

function ctxNow(){return {name:S.name||'Y2K Select Shop', bg:S.bg||'pink', paint:TITLE_STYLES[S.titleStyle||'pink'].paint, lines:briefLines(), logo:S.logo==='ai'?'chrome':S.logo}}
function renderPoster(els, opts={}){
  const cx=opts.ctx||ctxNow(); const nb=NEON[cx.bg];
  let html=`<div class="pbg" style="background:${nb.bg}"></div>`;
  for(const e of els){
    if(e.type==='bg')continue;
    const pos=`left:${e.c*100/COLS}%;top:${e.r*100/ROWS}%;width:${e.w*100/COLS}%;height:${e.h*100/ROWS}%;`;
    let inner='';
    if(e.type==='title') inner=textSVG(e.txt||cx.name, e.w, e.h, {paint:cx.paint});
    else if(e.type==='logo') inner=logoSVG(cx.logo||'chrome', cx.name, cx.paint, nb.ink);
    else if(e.type==='product') inner=`<img src="${PRODUCTS.find(x=>x.id===e.pid).file}" alt="">`;
    else if(e.type==='sticker') inner=stickerSVG(e.sym,cx.paint);
    else if(e.type==='info') inner=infoSVG(cx.lines, e, nb.ink);
    const sel = opts.edit && S.sel===e.id;
    html+=`<div class="el ${e.type} ${sel?'sel':''}" data-id="${e.id}" style="${pos}">${inner}${sel?'<i class="hdl" data-hdl="1"></i>':''}</div>`;
  }
  return `<div class="poster ${opts.edit?'edit':''}" ${opts.id?`id="${opts.id}"`:''}>${html}${opts.edit?'<div class="grid"></div>':''}</div>`;
}
// 文字資訊：多行、左對齊，字級跟著框放大縮小
function infoSVG(lines, e, ink){
  if(!lines.length)return '';
  const mw=Math.max(...lines.map(l=>lineW(l)))*0.92+20, mh=lines.length*LH+20;
  const vw=Math.max(mw,mh*e.w/e.h), vh=vw*e.h/e.w; const y0=vh/2-(lines.length-1)*LH/2;
  return `<svg viewBox="0 0 ${vw.toFixed(1)} ${vh.toFixed(1)}" preserveAspectRatio="xMidYMid meet">${lines.map((l,i)=>`<text x="${((vw-mw)/2+10).toFixed(1)}" y="${y0+i*LH}" dy=".35em" font-size="${FS*0.9}" font-family="${ZH_FONT}" fill="${ink}" stroke="${ink}" stroke-width="2.5">${esc(l)}</text>`).join('')}</svg>`;
}

let uid=0;
function aiLayout(name=S.name){
  const els=[]; const R=(c,r,w,h)=>({c,r,w,h});
  if(S.briefAI){
    els.push({id:++uid,type:'title',txt:'Y2K COLLECTION',...R(0,0,12,3)});
    [[0,3],[4,3],[8,3],[1,7],[5,7],[9,6]].forEach((p,i)=>els.push({id:++uid,type:'product',pid:PRODUCTS[i].id,...R(p[0],p[1],3,3)}));
    shuffle([[3,3],[7,4],[0,6],[11,7],[4,10],[8,10],[0,10],[10,10],[3,6],[7,7]]).forEach((p,i)=>els.push({id:++uid,type:'sticker',sym:STICKERS[i%STICKERS.length],...R(Math.min(p[0],10),p[1],2,2)}));
    els.push({id:++uid,type:'title',txt:name,...R(0,13,7,2)});
    els.push({id:++uid,type:'info',...R(7,13,5,2)});
    return els;
  }
  els.push({id:++uid,type:'title',...R(0,0,12,3)});
  const prods=[...S.products];
  const slots = prods.length<=2 ? [[0,3,6,6],[6,5,6,6]] : [[0,3,4,4],[4,3,4,4],[8,3,4,4],[0,7,4,4],[4,7,4,4],[8,7,4,4]];
  prods.forEach((pid,i)=>{const s=slots[i%slots.length];els.push({id:++uid,type:'product',pid,...R(...s)})});
  shuffle([[0,3],[10,3],[4,7],[10,9],[0,9],[7,3],[10,11],[0,11],[5,11],[8,11]]).slice(0,9)
    .forEach((p,i)=>els.push({id:++uid,type:'sticker',sym:STICKERS[i%STICKERS.length],...R(p[0],p[1],2,2)}));
  els.push({id:++uid,type:'info',...R(0,12,9,3)});
  els.push({id:++uid,type:'logo',...R(9,12,3,3)});
  return els;
}

  if(sc.flags.has('product'))research.push(RESEARCH.product);
  if(sc.flags.has('distinct'))research.push(RESEARCH.distinct);
  if(sc.flags.has('audience'))research.push(RESEARCH.audience);
  if(sc.P-sc.total>=25||research.length<2)research.push(RESEARCH.pretty);

    <p class="sub">用掉 ${START_DAYS-S.days} 天，剩 ${S.days} 天。</p>

/* ===================== 流程 ===================== */
function go(step){
  if(S.days<=0){
    if(step==='logo'&&S.logo===null){S.logo='ai';logStep('Logo','ai','時間不夠，交給 AI');autoAI('Logo');return go('color')}
    if(step==='color'&&S.palette===null){applyAIColor();logStep('顏色和字','ai','時間不夠，交給 AI');autoAI('顏色和字');return go('brief')}
    if(step==='brief'&&S.briefAI===null){S.briefAI=true;S.products=new Set(PRODUCTS.map(p=>p.id));logStep('需求單','ai','時間不夠，交給 AI');autoAI('需求單');return go('gen')}
  }
  S.step=step;S.sel=null;render();window.scrollTo({top:0,behavior:'smooth'});
  if(step==='gen'){setTimeout(()=>{S.elements=aiLayout();genDone()},1400)}
}
function render(){
  app.innerHTML = (S.step==='intro'||S.step==='end'?'':daysBar()) + V[S.step]();
  if(S.step==='editor')bindEditor();
  if(S.step==='gen'&&S.elements.length)genDone();
}
function autoAI(stepLabel){toast(`開幕倒數用完了，${stepLabel}交給 AI。`)}
function applyAIColor(){S.palette='pink';S.titleStyle='pink';S.bg='pink';S.colorAI=true}

app.addEventListener('click', e=>{
  const t=e.target.closest('[data-act],[data-go]'); if(!t||t.disabled)return;
  if(t.dataset.go){go(t.dataset.go);return}
  const a=t.dataset.act, v=t.dataset.v;
  switch(a){
    case 'nameSelf':{const n=$('#nm').value.trim(); if(!n){toast('先輸入店名');return} S.name=n;S.nameAI=false;spend(1);logStep('店名','me',n);go('logo');break}
    case 'nameAI': S.name=v;S.nameAI=true;logStep('店名','ai',v);toast(`Threads 上已經有 12 家叫「${v}」的店⋯⋯`);go('logo');break;
    case 'logo': S.logo=v; if(v!=='ai'){spend(1);logStep('Logo','me',LOGOS[v].label)}else logStep('Logo','ai','泡泡金屬字＋閃亮小圖'); go('color');break;
    case 'pickPal': S._pal=v; render(); break;
    case 'pickTs': S._ts=v; render(); break;
    case 'colorSelf': S.palette=S._pal;S.titleStyle=S._ts;S.bg=PALETTES[S._pal].bg;S.colorAI=false;spend(1);logStep('顏色和字','me',`${PALETTES[S._pal].label}・${TITLE_STYLES[S._ts].label}`);go('brief');break;
    case 'colorAI': applyAIColor();logStep('顏色和字','ai','螢光粉＋粉色液態字');go('brief');break;
    case 'brief': S.brief.has(v)?S.brief.delete(v):S.brief.add(v); render(); break;
    case 'prod': S.products.has(v)?S.products.delete(v):S.products.add(v); render(); break;
    case 'briefSelf': S.briefAI=false;spend(1);logStep('需求單','me',`寫了 ${S.brief.size} 項、放 ${S.products.size} 件商品`);go('gen');break;
    case 'briefAI': S.briefAI=true;S.brief=new Set();S.products=new Set(PRODUCTS.map(p=>p.id));logStep('需求單','ai','AI 自己想');go('gen');break;
    case 'layoutSelf': spend(2);S.layoutSelf=true;go('editor');break;
    case 'layoutAI': S.layoutSelf=false;logStep('排版','ai','直接用 AI 版');go('test');break;
    case 'grow': case 'shrink': resizeSel(a==='grow'?1:-1);break;
    case 'del': S.elements=S.elements.filter(x=>x.id!==S.sel);S.sel=null;render();break;
    case 'bg': S.bg=v; render(); break;
    case 'togProd':{const ex=S.elements.find(x=>x.type==='product'&&x.pid===v); if(ex)S.elements=S.elements.filter(x=>x!==ex); else addProduct(v); render();break}
    case 'addSticker': S.elements.push({id:++uid,type:'sticker',sym:STICKERS[Math.floor(Math.random()*STICKERS.length)],c:10,r:0,w:2,h:2});render();break;
    case 'addInfo': S.elements.push({id:++uid,type:'info',c:0,r:12,w:9,h:3});render();break;
    case 'addLogo': S.elements.push({id:++uid,type:'logo',c:9,r:12,w:3,h:3});render();break;
    case 'layoutDone': logStep('排版','me','自己調整版面'); if(S.tested){S.testResult=runTest();go('testResult')} else go('test'); break;
    case 'testGo': spend(1);S.tested=true;flashTest();break;
    case 'testSkip': logStep('給別人看','ai','沒找人看');go('export');break;
    case 'revise': spend(1);S.revised=true;S.layoutSelf=true;go('editor');break;
    case 'exp': S.exportJpg = v==='jpg'; if(v==='layer'){spend(1);logStep('送印','me','分層檔')}else logStep('送印','ai','直接存 JPG'); go('end');break;
    case 'again': reset(); go('intro'); break;
    case 'copy': try{navigator.clipboard.writeText(location.href).then(()=>toast('已複製連結'),()=>toast('請手動複製網址'))}catch(err){toast('請手動複製網址')} break;
  }
});
function addProduct(pid){
  const taken=S.elements.filter(x=>x.type==='product').length;
  const spots=[[0,3,6,6],[6,5,6,6],[3,4,6,6],[0,9,5,4]];
  const s=spots[taken%spots.length];
  S.elements.push({id:++uid,type:'product',pid,c:s[0],r:s[1],w:s[2],h:s[3]});
}

/* ===================== 排版編輯 ===================== */
function clampEl(e){e.w=Math.max(1,Math.min(COLS,e.w));e.h=Math.max(1,Math.min(ROWS,e.h));e.c=Math.max(0,Math.min(COLS-e.w,e.c));e.r=Math.max(0,Math.min(ROWS-e.h,e.r))}
function resizeSel(d){
  const e=S.elements.find(x=>x.id===S.sel); if(!e)return;
  const step=2*d;
  if(e.type==='title'||e.type==='info'){ // 字：等比例放大
    const k=(e.w+step)/e.w; e.w+=step; e.h=Math.max(1,Math.round(e.h*k));
  } else { e.w+=step; e.h+=step; }
  if(d>0){ if(e.c+e.w>COLS)e.c=COLS-e.w; if(e.r+e.h>ROWS)e.r=ROWS-e.h; }
  clampEl(e); render();
}
function bindEditor(){
  const P=$('#edposter'); if(!P)return;
  let drag=null;
  P.addEventListener('pointerdown',ev=>{
    const el=ev.target.closest('.el'); if(!el){S.sel=null;render();return}
    const id=+el.dataset.id; const e=S.elements.find(x=>x.id===id);
    const cell=P.getBoundingClientRect().width/COLS;
    drag={e,el,sx:ev.clientX,sy:ev.clientY,c:e.c,r:e.r,w:e.w,h:e.h,cell,mode:ev.target.dataset.hdl?'size':'move'};
    el.setPointerCapture(ev.pointerId); ev.preventDefault();
    S.elements=S.elements.filter(x=>x!==e);S.elements.push(e);
  });
  P.addEventListener('pointermove',ev=>{
    if(!drag)return;
    const dc=Math.round((ev.clientX-drag.sx)/drag.cell), dr=Math.round((ev.clientY-drag.sy)/drag.cell);
    const e=drag.e;
    if(drag.mode==='move'){e.c=drag.c+dc;e.r=drag.r+dr}
    else {e.w=Math.max(1,Math.min(COLS-e.c,drag.w+dc));e.h=Math.max(1,Math.min(ROWS-e.r,drag.h+dr))}
    clampEl(e);
    drag.el.style.left=e.c*100/COLS+'%';drag.el.style.top=e.r*100/ROWS+'%';drag.el.style.width=e.w*100/COLS+'%';drag.el.style.height=e.h*100/ROWS+'%';
  });
  const end=()=>{if(!drag)return;S.sel=drag.e.id;drag=null;render()};
  P.addEventListener('pointerup',end);P.addEventListener('pointercancel',end);
}

/* ===================== 3 秒測試 ===================== */
function runTest(){
  const sc=scores();
  const people=shuffle(PEOPLE).slice(0,3);
  const p=Math.max(.05,Math.min(.95,(sc.K-20)/70));
  const nSt=S.elements.filter(e=>e.type==='sticker').length;
  const pool = nSt>=4 ? WRONG_SPARKLE : WRONG_SMALL;
  let right=0;
  const lines=people.map((pp,i)=>{
    const ok=Math.random()<p; if(ok)right++;
    let ta='';
    if(pp.ta) ta = ok&&sc.T>=60 ? '（目標客群）「感覺是給我的，想去逛。」' : '（目標客群）「好像不是給我的。」';
    return {who:pp.n, ok, say: ok?RIGHT[i%RIGHT.length]:pool[(i+Math.floor(Math.random()*pool.length))%pool.length], ta};
  });
  const items=S.briefAI?AI_BRIEF:[...S.brief];
  let friend;
  if(sc.K<55) friend = nSt>=4 ? '貼紙太搶了，商品被淹沒。先把一件主商品放大，貼紙留兩三個就好。' : '商品太小，三秒內看不出你賣什麼。挑一件主商品放大到海報的一半。';
  else if(sc.T<55) friend = items.includes('A') ? '有寫客群，但顏色和字不太像在對她們說話。' : '你想賣給誰？需求單裡沒寫客群，AI 只能猜，猜出來就誰都不像在對他說話。';
  else if(sc.M<55) friend = '這張跟隔壁家太像了。換掉 AI 給的名字、顏色或排法，至少留一樣只有你有的東西。';
  else friend = '看得懂，也有自己的樣子。之後每張圖都沿用這組顏色、字和 Logo，客人就會記得你。';
  return {right,lines,friend};
}
function flashTest(){
  const ov=document.createElement('div'); ov.className='flash';
  ov.innerHTML=`<div class="cd">3</div>${renderPoster(S.elements)}<div class="sub" style="color:#cfc6ea">路人只看 3 秒⋯⋯</div>`;
  document.body.appendChild(ov);
  let n=3; const t=setInterval(()=>{n--; if(n>0)ov.querySelector('.cd').textContent=n; else {clearInterval(t);ov.remove();S.testResult=runTest();logStep('給別人看','me','找 3 個人看 3 秒');go('testResult')}},1000);
}

reset(); render();

document.fonts && Promise.all([document.fonts.load(`100px yink`,'Y2K'),document.fonts.load(`100px 'Bagel Fat One'`)]).then(()=>document.fonts.load(`100px Huninn`,'我的第一張海報選物店')).then(()=>document.fonts.ready).then(()=>render());
