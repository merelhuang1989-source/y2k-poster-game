<style>
:root{
  --paper:#f6f1e9;--ink:#1a1410;--mute:#6f6458;--line:#e2d8ca;
  --red:#ff4b1f;--yellow:#ffe01a;--card:#fffdf9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);background:var(--paper)}
.app{max-width:440px;margin:0 auto;padding:14px 14px 40px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.top .t{font-size:13px;color:var(--mute);letter-spacing:.06em}
.days{display:flex;align-items:center;gap:6px;font-size:13px;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:4px 10px 4px 8px}
.days .dots{display:flex;gap:3px}
.days .dots i{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 6px #ff7a1a}
.days .dots i.used{background:#e6ddd0;box-shadow:none}
.days b{font-size:15px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:18px 16px;box-shadow:4px 4px 0 var(--ink)}
.step{font-size:12px;color:#d13a12;letter-spacing:.12em;margin-bottom:4px;font-weight:700}
h2{font-size:22px;margin:0 0 6px;font-weight:900}
p{line-height:1.65;margin:6px 0}
.sub{color:var(--mute);font-size:14px}
.cis{display:inline-block;margin:2px 0 8px;padding:5px 10px;border-radius:8px;background:#fff3e0;border:1.5px solid #ffb37a;font-size:13.5px;line-height:1.5}
.cis b{color:#d13a12;margin-right:4px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit;color:inherit;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt .pv{flex:0 0 74px;height:74px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.opt .tx{flex:1}
.opt .tx b{display:block;font-weight:700;font-size:16px}
.opt .tx small{color:var(--mute);font-size:12.5px;line-height:1.5;display:block;margin-top:2px}
.opt.sel{border-color:var(--ink);box-shadow:3px 3px 0 var(--red)}
.cost{font-size:12px;border-radius:999px;padding:3px 8px;white-space:nowrap;background:#f1ebe2;color:#5a4a3a}
.cost.ai{background:linear-gradient(90deg,#3a2a12,#7a5520);color:#ffe2a0}
.opt[disabled]{opacity:.42;cursor:not-allowed}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px;color:#fff;background:var(--ink);box-shadow:3px 3px 0 var(--red)}
.btn.ai{color:#ffe2a0;background:linear-gradient(135deg,#0b0806,#3a2a12 60%,#0b0806);box-shadow:inset 0 0 0 1.5px #c99a45,0 6px 18px -10px #e3a43a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px}.row>*{flex:1}
input[type=text]{width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;color:inherit}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.label{font-size:13px;color:var(--mute);margin:14px 0 4px}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.prod{border:2px solid var(--line);border-radius:10px;background:#fff;padding:6px;cursor:pointer;text-align:center;font-size:12px;color:var(--mute)}
.prod img{width:100%;height:70px;object-fit:contain;display:block}
.prod img.ph{object-fit:cover;border-radius:4px}
.prod.on{border-color:var(--ink);box-shadow:2px 2px 0 var(--red);color:var(--ink)}
.ai-say{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
.ai-say .who{flex:0 0 34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#e3a43a 55%,#6b4210);display:flex;align-items:center;justify-content:center;font-size:12px;color:#2a1a06;font-weight:700}
.bubble{background:#fff;border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:14.5px;line-height:1.6;border:1.5px solid var(--line)}
.say{background:#fff;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14.5px;line-height:1.6;border:2px solid var(--line)}
.say b{color:#d13a12}
.say.good{border-color:#3fb37f}.say.bad{border-color:#ff8f70}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* poster */
.poster{position:relative;width:100%;aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:#fff;box-shadow:0 14px 30px -18px #1a1410;container-type:inline-size;user-select:none;-webkit-user-select:none}
.poster .el{position:absolute;display:flex;align-items:center;justify-content:center}
.poster .pbg{position:absolute;inset:0}
.poster .el img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 1.2cqw 1.6cqw #0005)}
.poster .el img.ph{object-fit:cover;filter:none;border:1.2cqw solid #fff;box-shadow:0 1cqw 2cqw #0004}
.poster .el img.aiglow{object-fit:cover;filter:none;-webkit-mask-image:radial-gradient(closest-side,#000 62%,transparent);mask-image:radial-gradient(closest-side,#000 62%,transparent)}
.poster svg{width:100%;height:100%;overflow:visible}
.poster.edit .el{touch-action:none;cursor:grab;outline:1px dashed #ffffffaa;outline-offset:-1px}
.poster.edit .el.sel{outline:2px solid #fff;box-shadow:0 0 0 2px var(--ink) inset}
.grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#fff7 1px,transparent 1px),linear-gradient(90deg,#fff7 1px,transparent 1px);background-size:calc(100%/12) calc(100%/15);opacity:.45}
.hdl{position:absolute;right:-9px;bottom:-9px;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--ink);cursor:nwse-resize;z-index:5;touch-action:none}
.chip.sw i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;box-shadow:0 0 0 1px #0003}
.bigt{width:100%;margin:2px 0 8px;border-radius:12px;background:#0b0806;padding:4px 8px}.bigt svg{width:100%;height:100%;display:block;overflow:visible}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tools .chip{font-size:13px;padding:7px 11px}
.tools.layers{align-items:center;margin-top:6px}
.chip[disabled]{opacity:.35;cursor:not-allowed}
.flash{position:fixed;inset:0;background:#0b0806f2;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff}
.flash .poster{width:min(78vw,340px)}
.flash .cd{font-size:44px;font-family:Mantou}
.tape{position:relative;padding:14px 10px 6px}
.tape:before,.tape:after{content:"";position:absolute;top:4px;width:70px;height:22px;background:#fffbe8cc;box-shadow:0 1px 3px #0002;z-index:2}
.tape:before{left:6px;transform:rotate(-8deg)}.tape:after{right:6px;transform:rotate(7deg)}

/* report */
.pct{text-align:center;font-size:15px;color:var(--mute)}
.meter{margin:10px 0}
.meter .hd{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.meter .bar{height:12px;border-radius:999px;background:#ece4d8;overflow:hidden;margin-top:4px;border:1.5px solid var(--ink)}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff4b1f,#ffb000)}
.meter.pretty .bar i{background:repeating-linear-gradient(135deg,#e6c98c 0 6px,#f6ead0 6px 12px)}
.meter small{color:var(--mute);font-size:12px}
.gap{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:14.5px;line-height:1.6}
.twins{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.twins .cap{font-size:11px;color:var(--mute);text-align:center;margin-top:3px}
.log{font-size:13.5px;line-height:1.7;padding-left:0;list-style:none;margin:6px 0}
.log li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}
.log .me{color:#1f8a5a;text-align:right}.log .ai{color:#a8660a;text-align:right}
.research{font-size:13px;line-height:1.65;color:#4a3f35;background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;border:1.5px solid var(--line)}
.research p{margin:4px 0}
.foot{font-size:11.5px;color:var(--mute);text-align:center;margin-top:18px;line-height:1.6}
</style>
</head>

/* ===================== 赤提灯發光字 ===================== */
// 每段字固定用 100 單位排，再用 viewBox 縮放到格子大小，所以放多大光暈都一樣。
const FS=100, LS=4, LH=118;
const _cv=document.createElement('canvas').getContext('2d');
function measure(str, font=TITLE_FONT){_cv.font=`${FS}px ${font}`;return _cv.measureText(str).width + LS*[...str].length}
function tokens(text){ // 英文以單字為單位、中文以字為單位
  const out=[]; let buf='';
  for(const ch of text){ if(/[A-Za-z0-9]/.test(ch)){buf+=ch} else { if(buf){out.push(buf);buf=''} out.push(ch) } }
  if(buf)out.push(buf); return out;
}
function wrap(text,n,font){
  if(n===1)return [text];
  const tk=tokens(text), target=measure(text,font)/n, lines=[]; let cur='';
  for(const t of tk){ if(cur && lines.length<n-1 && measure(cur+t,font)>target*1.08){lines.push(cur.trim());cur=t.trimStart()} else cur+=t }
  lines.push(cur.trim()); return lines.filter(Boolean);
}
// w,h：框的比例（格數）；ts：TITLE_STYLES 的 key
function textSVG(text, w, h, {ts='white', maxLines=3}={}){
  const st=TITLE_STYLES[ts]; let best=null;
  for(let n=1;n<=maxLines;n++){
    const lines=wrap(text,n); const mw=Math.max(...lines.map(l=>measure(l)))+FS*.5; const mh=lines.length*LH+FS*.5;
    const sc=Math.min(w/mw,h/mh);
    if(!best||sc>best.sc*1.04)best={sc,lines,mw,mh};
  }
  const {lines,mw,mh}=best;
  const vw=Math.max(mw,mh*w/h), vh=vw*h/w;
  const y0=vh/2-(lines.length-1)*LH/2;
  const body=lines.map((ln,i)=>`<text x="${vw/2}" y="${y0+i*LH}" dy=".36em" text-anchor="middle" font-size="${FS}" letter-spacing="${LS}" font-family="${TITLE_FONT}">${esc(ln)}</text>`).join('');
  // 外圈深色細邊：亮色底上也看得清楚；再疊發光
  return `<svg viewBox="0 0 ${vw.toFixed(1)} ${vh.toFixed(1)}" preserveAspectRatio="xMidYMid meet"><g filter="url(#${st.glow})"><g fill="${st.fill}" stroke="#1a1410" stroke-width="7" stroke-linejoin="round" paint-order="stroke">${body}</g></g></svg>`;
}

/* ===================== 計分（唯一的規則來源） ===================== */
function scores(st=S){
  let K=45,T=35,M=50,P=50; const flags=new Set();
  const add=fx=>{K+=fx.K||0;T+=fx.T||0;M+=fx.M||0;P+=fx.P||0};
  if(st.nameAI){M-=15;flags.add('distinct')} else if(st.name){M+=5; if(NAME_HINT.test(st.name))K+=6; if([...st.name].length>8)K-=5}
  if(st.logo){add(LOGOS[st.logo].fx); if(st.logo==='ai')flags.add('distinct')}
  if(st.palette){add(PALETTES[st.palette].fx); if(st.palette==='yellow'&&st.brief.has('E'))T+=5}
  if(st.titleStyle)add(TITLE_STYLES[st.titleStyle].fx);
  if(st.colorAI){M-=4;flags.add('distinct')}
  const items = st.briefAI ? AI_BRIEF : [...st.brief];
  items.forEach(id=>add(BRIEF.find(b=>b.id===id).fx));
  if(items.length>5){K-=15;flags.add('clutter')}
  if(!items.includes('A'))flags.add('audience');
  if(st.products.size>=5){K-=8;flags.add('clutter')}
  const els=st.elements;
  if(els.length){
    const area=e=>e.w*e.h;
    const prods=els.filter(e=>e.type==='product');
    const maxA=Math.max(0,...prods.map(area));
    if(maxA>=36)K+=15; else if(maxA>=16)K+=5; else K-=20;
    if(maxA<36)flags.add('product');
    const titles=els.filter(e=>e.type==='title');
    const nameA=Math.max(0,...titles.filter(e=>!e.txt||e.txt===st.name).map(area));
    const otherA=Math.max(0,...titles.filter(e=>e.txt&&e.txt!==st.name).map(area));
    if(nameA>=54)K+=10; else if(nameA<=12)K-=10;
    if(otherA>nameA){K-=4;M-=8;flags.add('distinct')}
    const n=els.filter(e=>e.type==='sticker').length;
    P+=Math.min(16,n*2);
    if(n>=8){K-=15;flags.add('clutter')} else if(n>=4){K-=8;flags.add('clutter')}
    if(els.filter(e=>e.type==='info').length>4)K-=10;   // 文字資訊超過 4 行
    if(!st.layoutSelf){M-=8;flags.add('distinct')}
    if(st.bg==='green'||st.bg==='pink'){M-=4}
    K+=APPETITE[st.bg]||0;
  }
  if(st.tested)K+=5;
  if(st.exportJpg)K-=8;
  K+=st.luck;
  const c=v=>Math.max(0,Math.min(100,Math.round(v)));
  K=c(K);T=c(T);M=c(M);P=c(P);
  return {K,T,M,P,total:Math.round(.4*K+.3*T+.3*M),flags};
}

/* ===================== 海報 ===================== */
function logoSVG(kind, name, ink){
  const ch=[...(name||'燒肉')].filter(c=>c.trim()&&!/[・·]/.test(c)).slice(0,2).join('');
  if(kind==='cow') return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#fff6e6" stroke="${ink==='#ffffff'?'#1a1410':ink}" stroke-width="6"/><image href="${MASCOTS[S.mascot||'cow'].file}" x="18" y="18" width="64" height="64" preserveAspectRatio="xMidYMid meet"/></svg>`;
  if(kind==='stamp') return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43" fill="none" stroke="${ink}" stroke-width="6"/><circle cx="50" cy="50" r="35" fill="none" stroke="${ink}" stroke-width="2"/><text x="50" y="50" dy=".36em" text-anchor="middle" font-family="${TITLE_FONT}" font-size="${[...ch].length>1?28:40}" fill="${ink}">${esc(ch)}</text></svg>`;
  return `<svg viewBox="0 0 100 100"><g filter="url(#foil)"><use href="#s-flame" x="6" y="2" width="88" height="96" fill="url(#goldG)"/></g><text x="50" y="62" dy=".36em" text-anchor="middle" font-family="${TITLE_FONT}" font-size="24" fill="#2a1a06">${esc(ch)}</text></svg>`;
}
const STICKERS=['s-spark','s-flame','s-burst','s-kiwami','s-spark','s-dot','s-flame','s-spark','s-burst','s-kiwami'];
function stickerSVG(sym){return `<svg viewBox="0 0 100 100"><g filter="url(#foil)"><use href="#${sym}" x="10" y="10" width="80" height="80" fill="url(#goldG)"/></g></svg>`}

function ctxNow(){return {name:S.name||'炙・燒肉', bg:S.bg||'black', ts:S.titleStyle||'gold', lines:briefLines(), logo:S.logo==='ai'?'gold':S.logo}}
function renderPoster(els, opts={}){
  const cx=opts.ctx||ctxNow(); const nb=BGS[cx.bg];
  let html=`<div class="pbg" style="background:${nb.bg}"></div>`;
  for(const e of els){
    const pos=`left:${e.c*100/COLS}%;top:${e.r*100/ROWS}%;width:${e.w*100/COLS}%;height:${e.h*100/ROWS}%;`;
    let inner='';
    if(e.type==='title') inner=textSVG(e.txt||cx.name, e.w, e.h, {ts:cx.ts});
    else if(e.type==='logo') inner=logoSVG(cx.logo||'gold', cx.name, nb.ink);
    else if(e.type==='product'){const p=prodOf(e.pid); inner=`<img class="${p.photo?'ph':''}" src="${p.file}" alt="">`}
    else if(e.type==='aimeat') inner=`<img class="aiglow" src="${AI_MEAT}" alt="">`;
    else if(e.type==='sticker') inner=stickerSVG(e.sym);
    else if(e.type==='info') inner=infoSVG(e.line!=null?[e.line]:cx.lines, e, nb.ink);
    const sel = opts.edit && S.sel===e.id;
    html+=`<div class="el ${e.type} ${sel?'sel':''}" data-id="${e.id}" style="${pos}">${inner}${sel?'<i class="hdl" data-hdl="1"></i>':''}</div>`;
  }
  return `<div class="poster ${opts.edit?'edit':''}" ${opts.id?`id="${opts.id}"`:''}>${html}${opts.edit?'<div class="grid"></div>':''}</div>`;
}
// 文字資訊：思源黑體粗體、多行、左對齊，字級跟著框放大縮小
function infoSVG(lines, e, ink){
  if(!lines.length)return '';
  const mw=Math.max(...lines.map(l=>measure(l,BODY_FONT)))*0.92+20, mh=lines.length*LH+20;
  const vw=Math.max(mw,mh*e.w/e.h), vh=vw*e.h/e.w; const y0=vh/2-(lines.length-1)*LH/2;
  return `<svg viewBox="0 0 ${vw.toFixed(1)} ${vh.toFixed(1)}" preserveAspectRatio="xMidYMid meet">${lines.map((l,i)=>`<text x="${((vw-mw)/2+10).toFixed(1)}" y="${y0+i*LH}" dy=".35em" font-size="${FS*0.9}" font-family="${BODY_FONT}" font-weight="700" fill="${ink}">${esc(l)}</text>`).join('')}</svg>`;
}

let uid=0;
// 一行一個文字物件：由下往上疊在左下角（9 欄寬、1 列高）
function infoEls(lines){const n=lines.length;return lines.map((line,i)=>({id:++uid,type:'info',line,c:0,r:Math.max(0,15-n+i),w:9,h:1}))}
function aiLayout(name=S.name, st=S, lines=briefLines()){
  const els=[]; const R=(c,r,w,h)=>({c,r,w,h});
  if(st.briefAI){
    els.push({id:++uid,type:'title',txt:'極上燒肉 YAKINIKU',...R(0,0,12,3)});
    els.push({id:++uid,type:'aimeat',...R(3,5,6,5)});
    [[0,3],[4,3],[8,3],[0,9],[4,10],[9,9]].forEach((p,i)=>els.push({id:++uid,type:'product',pid:PRODUCTS[i].id,...R(p[0],p[1],3,3)}));
    shuffle([[3,3],[7,4],[0,6],[10,7],[3,8],[8,8],[0,12],[10,12],[3,6],[7,6]]).forEach((p,i)=>els.push({id:++uid,type:'sticker',sym:STICKERS[i%STICKERS.length],...R(Math.min(p[0],10),p[1],2,2)}));
    els.push({id:++uid,type:'title',txt:name,...R(0,13,7,2)});
    lines.forEach((line,i)=>els.push({id:++uid,type:'info',line,...R(7,Math.max(0,15-lines.length+i),5,1)}));
    return els;
  }
  els.push({id:++uid,type:'title',...R(0,0,12,3)});
  const prods=[...st.products];
  const slots = prods.length<=2 ? [[0,3,6,6],[6,5,6,6]] : [[0,3,4,4],[4,3,4,4],[8,3,4,4],[0,7,4,4],[4,7,4,4],[8,7,4,4]];
  prods.forEach((pid,i)=>{const s=slots[i%slots.length];els.push({id:++uid,type:'product',pid,...R(...s)})});
  shuffle([[0,3],[10,3],[4,7],[10,9],[0,9],[7,3],[10,11],[0,11],[5,11],[8,11]]).slice(0,9)
    .forEach((p,i)=>els.push({id:++uid,type:'sticker',sym:STICKERS[i%STICKERS.length],...R(p[0],p[1],2,2)}));
  infoEls(lines).forEach(e=>els.push(e));
  els.push({id:++uid,type:'logo',...R(9,12,3,3)});
  return els;
}

/* ===================== 流程 ===================== */
function go(step){
  if(S.days<=0){
    if(step==='logo'&&S.logo===null){S.logo='ai';logStep('Logo','ai','時間不夠，交給 AI');autoAI('Logo');return go('color')}
    if(step==='color'&&S.palette===null){applyAIColor();logStep('顏色和字','ai','時間不夠，交給 AI');autoAI('顏色和字');return go('brief')}
    if(step==='brief'&&S.briefAI===null){S.briefAI=true;S.products=new Set(PRODUCTS.map(p=>p.id));logStep('需求單','ai','時間不夠，交給 AI');autoAI('需求單');return go('gen')}
  }
  S.step=step;S.sel=null;render();window.scrollTo({top:0,behavior:'smooth'});
  if(step==='gen'){setTimeout(()=>{S.elements=aiLayout();genDone()},1400)}
}
function render(){
  app.innerHTML = (S.step==='intro'||S.step==='end'?'':daysBar()) + V[S.step]();
  if(S.step==='editor')bindEditor();
  if(S.step==='gen'&&S.elements.length)genDone();
}
function autoAI(stepLabel){toast(`時間不夠了，${stepLabel}交給 AI。`)}
function applyAIColor(){S.palette='black';S.titleStyle='gold';S.bg='black';S.colorAI=true}

app.addEventListener('click', e=>{
  const t=e.target.closest('[data-act],[data-go]'); if(!t||t.disabled)return;
  if(t.dataset.go){go(t.dataset.go);return}
  const a=t.dataset.act, v=t.dataset.v;
  switch(a){
    case 'nameSelf':{const n=$('#nm').value.trim(); if(!n){toast('先輸入店名');return} S.name=n;S.nameAI=false;spend(1);logStep('店名','me',n);go('logo');break}
    case 'nameAI': S.name=v;S.nameAI=true;logStep('店名','ai',v);toast(`Threads 上已經有 12 家叫「${v}」的店⋯⋯`);go('logo');break;
    case 'logo': S.logo=v; if(v!=='ai'){spend(1);logStep('Logo','me',v==='cow'?MASCOTS[S.mascot].label:LOGOS[v].label)}else logStep('Logo','ai','金色火焰字'); go('color');break;
    case 'pickPal': S._pal=v; render(); break;
    case 'pickTs': S._ts=v; render(); break;
    case 'colorSelf': S.palette=S._pal;S.titleStyle=S._ts;S.bg=PALETTES[S._pal].bg;S.colorAI=false;spend(1);logStep('顏色和字','me',`${PALETTES[S._pal].label}・${TITLE_STYLES[S._ts].label}`);go('brief');break;
    case 'colorAI': applyAIColor();logStep('顏色和字','ai','黑底＋金箔字');go('brief');break;
    case 'brief': S.brief.has(v)?S.brief.delete(v):S.brief.add(v); render(); break;
    case 'prod': S.products.has(v)?S.products.delete(v):S.products.add(v); render(); break;
    case 'briefSelf': S.briefAI=false;spend(1);logStep('需求單','me',`寫了 ${S.brief.size} 項、放 ${S.products.size} 樣菜`);go('gen');break;
    case 'briefAI': S.briefAI=true;S.brief=new Set();S.products=new Set(PRODUCTS.map(p=>p.id));logStep('需求單','ai','AI 自己想');go('gen');break;
    case 'layoutSelf': spend(2);S.layoutSelf=true;go('editor');break;
    case 'layoutAI': S.layoutSelf=false;logStep('排版','ai','直接用 AI 版');go('test');break;
    case 'grow': case 'shrink': resizeSel(a==='grow'?1:-1);break;
    case 'layer': moveLayer(v); break;
    case 'del': S.elements=S.elements.filter(x=>x.id!==S.sel);S.sel=null;render();break;
    case 'bg': S.bg=v; render(); break;
    case 'togProd':{const ex=S.elements.find(x=>x.type==='product'&&x.pid===v); if(ex)S.elements=S.elements.filter(x=>x!==ex); else addProduct(v); render();break}
    case 'addSticker': S.elements.push({id:++uid,type:'sticker',sym:STICKERS[Math.floor(Math.random()*STICKERS.length)],c:10,r:0,w:2,h:2});render();break;
    case 'addInfo':{ // 放回的每一行，找左下角還沒被文字占用的那一列
      const used=r=>S.elements.some(x=>x.type==='info'&&r>=x.r&&r<x.r+x.h);
      for(const line of missingLines()){let r=14;while(r>0&&used(r))r--;S.elements.push({id:++uid,type:'info',line,c:0,r,w:9,h:1})}
      render();break}
    case 'addLogo': S.elements.push({id:++uid,type:'logo',c:9,r:12,w:3,h:3});render();break;
    case 'layoutDone': logStep('排版','me','自己調整版面'); if(S.tested){S.testResult=runTest();go('testResult')} else go('test'); break;
    case 'testGo': spend(1);S.tested=true;flashTest();break;
    case 'testSkip': logStep('給別人看','ai','沒找人看');go('export');break;
    case 'revise': spend(1);S.revised=true;S.layoutSelf=true;go('editor');break;
    case 'exp': S.exportJpg = v==='jpg'; if(v==='layer'){spend(1);logStep('送印','me','分層檔')}else logStep('送印','ai','直接存 JPG'); go('end');break;
    case 'again': reset(); go('intro'); break;
    case 'copy': try{navigator.clipboard.writeText(location.href).then(()=>toast('已複製連結'),()=>toast('請手動複製網址'))}catch(err){toast('請手動複製網址')} break;
  }
});
// 圖層：S.elements 的順序就是上下順序，越後面越上層（1 是最下層）
function layerNo(e){return S.elements.indexOf(e)+1}
function moveLayer(dir){
  const i=S.elements.findIndex(x=>x.id===S.sel); if(i<0)return;
  const els=S.elements, [e]=els.splice(i,1);
  const j = dir==='top'?els.length : dir==='bottom'?0 : dir==='up'?Math.min(els.length,i+1) : Math.max(0,i-1);
  els.splice(j,0,e); render();
}
function missingLines(){const have=new Set(S.elements.filter(e=>e.type==='info').map(e=>e.line));return briefLines().filter(l=>!have.has(l))}
function addProduct(pid){
  const taken=S.elements.filter(x=>x.type==='product').length;
  const spots=[[0,3,6,6],[6,5,6,6],[3,4,6,6],[0,9,5,4]];
  const s=spots[taken%spots.length];
  S.elements.push({id:++uid,type:'product',pid,c:s[0],r:s[1],w:s[2],h:s[3]});
}

/* ===================== 排版編輯 ===================== */
function clampEl(e){e.w=Math.max(1,Math.min(COLS,e.w));e.h=Math.max(1,Math.min(ROWS,e.h));e.c=Math.max(0,Math.min(COLS-e.w,e.c));e.r=Math.max(0,Math.min(ROWS-e.h,e.r))}
function resizeSel(d){
  const e=S.elements.find(x=>x.id===S.sel); if(!e)return;
  const step=2*d;
  if(e.type==='info'){ // 一行字：放大＝加寬加高，字跟著變大
    e.w+=step; e.h+=d;
  } else if(e.type==='title'){ // 字：等比例放大；寬已經滿版時改成加高
    if(d>0&&e.w>=COLS){e.h+=1}
    else {const k=(e.w+step)/e.w; e.w+=step; e.h=Math.max(1,Math.round(e.h*k));}
  } else { e.w+=step; e.h+=step; }
  if(d>0){ if(e.c+e.w>COLS)e.c=COLS-e.w; if(e.r+e.h>ROWS)e.r=ROWS-e.h; }
  clampEl(e); render();
}
function bindEditor(){
  const P=$('#edposter'); if(!P)return;
  let drag=null;
  P.addEventListener('pointerdown',ev=>{
    const el=ev.target.closest('.el'); if(!el){S.sel=null;render();return}
    const id=+el.dataset.id; const e=S.elements.find(x=>x.id===id);
    const cell=P.getBoundingClientRect().width/COLS;
    drag={e,el,sx:ev.clientX,sy:ev.clientY,c:e.c,r:e.r,w:e.w,h:e.h,cell,mode:ev.target.dataset.hdl?'size':'move'};
    el.setPointerCapture(ev.pointerId); ev.preventDefault();
  });
  P.addEventListener('pointermove',ev=>{
    if(!drag)return;
    const dc=Math.round((ev.clientX-drag.sx)/drag.cell), dr=Math.round((ev.clientY-drag.sy)/drag.cell);
    const e=drag.e;
    if(drag.mode==='move'){e.c=drag.c+dc;e.r=drag.r+dr}
    else {e.w=Math.max(1,Math.min(COLS-e.c,drag.w+dc));e.h=Math.max(1,Math.min(ROWS-e.r,drag.h+dr))}
    clampEl(e);
    drag.el.style.left=e.c*100/COLS+'%';drag.el.style.top=e.r*100/ROWS+'%';drag.el.style.width=e.w*100/COLS+'%';drag.el.style.height=e.h*100/ROWS+'%';
  });
  const end=()=>{if(!drag)return;S.sel=drag.e.id;drag=null;render()};
  P.addEventListener('pointerup',end);P.addEventListener('pointercancel',end);
}

/* ===================== 3 秒測試 ===================== */
function runTest(){
  const sc=scores();
  const people=shuffle(PEOPLE).slice(0,3);
  const p=Math.max(.05,Math.min(.95,(sc.K-20)/70));
  const nSt=S.elements.filter(e=>e.type==='sticker').length;
  const pool = nSt>=4 ? WRONG_SPARKLE : WRONG_SMALL;
  let right=0;
  const lines=people.map((pp,i)=>{
    const ok=Math.random()<p; if(ok)right++;
    let ta='';
    if(pp.ta) ta = ok&&sc.T>=60 ? '（目標客群）「下班可以約朋友來，感覺是給我的。」' : '（目標客群）「好像太高級了，不是給我的。」';
    return {who:pp.n, ok, say: ok?RIGHT[i%RIGHT.length]:pool[(i+Math.floor(Math.random()*pool.length))%pool.length], ta};
  });
  const items=S.briefAI?AI_BRIEF:[...S.brief];
  let friend;
  if(sc.K<55) friend = nSt>=4 ? '金色火花太搶了，肉被淹沒。先把一盤主菜放大，裝飾留兩三個就好。' : '肉太小，三秒內看不出你賣什麼。挑一盤主菜放大到海報的一半。';
  else if(sc.T<55) friend = items.includes('A') ? '有寫客群，但顏色和字不太像在對下班的上班族說話。' : '你想賣給誰？需求單裡沒寫客群，AI 只能猜，猜出來就誰都不像在對他說話。';
  else if(sc.M<55) friend = '這張跟隔壁家太像了：黑底、金字、發光的肉。換掉 AI 給的名字、顏色或排法，至少留一樣只有你有的東西。';
  else friend = '看得懂，也有自己的樣子。之後每張圖都沿用這組顏色、字和 Logo，客人就會記得你。';
  return {right,lines,friend};
}
function flashTest(){
  const ov=document.createElement('div'); ov.className='flash';
  ov.innerHTML=`<div class="cd">3</div>${renderPoster(S.elements)}<div class="sub" style="color:#e6d9c4">路人只看 3 秒⋯⋯</div>`;
  document.body.appendChild(ov);
  let n=3; const t=setInterval(()=>{n--; if(n>0)ov.querySelector('.cd').textContent=n; else {clearInterval(t);ov.remove();S.testResult=runTest();logStep('給別人看','me','找 3 個人看 3 秒');go('testResult')}},1000);
}

reset(); render();
// 字體載入後重新量字寬、重畫
document.fonts && Promise.all([document.fonts.load(`100px Mantou`,'我的第一張海報燒肉'),document.fonts.load(`700 100px 'Noto Sans TC'`,'炭火燒肉')]).then(()=>document.fonts.ready).then(()=>render());
</script>
